<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SNS Posts">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>SNS投稿ライブラリ | Masa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">SNS投稿ライブラリ</h1>
            <div class="stats">
                <span class="stat-item" id="totalPosts">0</span>
                <span class="stat-label">投稿</span>
            </div>
        </div>
    </header>

    <!-- Marketing Dashboard -->
    <section class="dashboard" id="dashboard">
        <div class="dashboard-inner">
            <h2 class="dashboard-title">マーケティング状況</h2>
            <div class="dashboard-counts">
                <div class="dashboard-count"><span class="dashboard-number" id="countDraft">0</span><span class="dashboard-label">下書き</span></div>
                <div class="dashboard-count"><span class="dashboard-number" id="countApproved">0</span><span class="dashboard-label">承認待ち</span></div>
                <div class="dashboard-count"><span class="dashboard-number" id="countPosted">0</span><span class="dashboard-label">投稿済み</span></div>
                <div class="dashboard-count"><span class="dashboard-number" id="countNeedsJudgement">0</span><span class="dashboard-label">要判定（48h経過）</span></div>
                <div class="dashboard-count"><span class="dashboard-number" id="countArchived">0</span><span class="dashboard-label">アーカイブ</span></div>
            </div>
            <div class="dashboard-next">
                <h3 class="dashboard-subtitle">次のテスト枠（下書きの先頭3件）</h3>
                <ol class="next-tests" id="nextTests"></ol>
                <p class="dashboard-note">判定は投稿から48時間後。ヒットの目安：ターゲット返信5件以上、またはターゲットフォロー3人以上。</p>
            </div>
            <div class="dashboard-pillars">
                <h3 class="dashboard-subtitle">柱別の内訳（アーカイブを除く）</h3>
                <div class="pillar-breakdown" id="pillarBreakdown"></div>
            </div>
        </div>
    </section>

    <!-- Search & Filter -->
    <div class="search-section">
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="キーワードで検索...">
            <button class="clear-btn" id="clearSearch" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="filter-chips">
            <button class="chip active" data-pillar="all">すべて</button>
            <button class="chip" data-pillar="overseas">海外キャリア</button>
            <button class="chip" data-pillar="ai-daily">AIと働く日常</button>
            <button class="chip" data-pillar="building-kinapse">Kinapseを作る</button>
            <button class="chip" data-pillar="clinical-kinapse-only">臨床（Kinapse用）</button>
        </div>
        <div class="filter-selects">
            <label class="filter-select-label">ステータス
                <select id="statusFilter" class="filter-select">
                    <option value="all">すべて（アーカイブを除く）</option>
                    <option value="draft">下書き</option>
                    <option value="approved">承認待ち</option>
                    <option value="posted">投稿済み</option>
                    <option value="archived">アーカイブ</option>
                </select>
            </label>
            <label class="filter-select-label">フックの型
                <select id="hookFilter" class="filter-select">
                    <option value="all">すべて</option>
                    <option value="ツッコミ">ツッコミ</option>
                    <option value="知識引き出し">知識引き出し</option>
                    <option value="AI機能を聞く">AI機能を聞く</option>
                </select>
            </label>
        </div>
    </div>

    <!-- Posts Grid -->
    <main class="posts-container" id="postsContainer">
        <!-- Posts will be dynamically inserted here -->
    </main>

    <!-- Post Detail Modal -->
    <div class="modal" id="postModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">閉じる</button>

            <div class="modal-body" id="modalBody">
                <!-- Content will be dynamically inserted -->
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span class="toast-message">コピーしました</span>
    </div>

    <!-- Loading Spinner -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>読み込み中...</p>
    </div>

    <script src="data.js"></script>
    <script src="marketing.js"></script>
    <script src="app.js"></script>
</body>

</html>
